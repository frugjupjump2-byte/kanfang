<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>看房筆記</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--tx:#1a1a1a;--mu:#666;--pr:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1e;--tx:#f2f2f2;--mu:#999}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Noto Sans TC","PingFang TC",sans-serif;padding:16px 16px 110px}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mu{color:var(--mu);font-size:13px}.big{font-size:22px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:flex;gap:4px;background:#8881;border-radius:10px;padding:3px;margin:12px 0;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:6px 10px;border-radius:8px;color:var(--tx);white-space:nowrap;font:inherit}
.tabs .on{background:var(--card);font-weight:600}
.b{font-size:12px;padding:2px 10px;border-radius:99px}
.s-心儀{background:#d1fae5;color:#065f46}.s-考慮中{background:#dbeafe;color:#1e40af}.s-已淘汰{background:#e5e7eb;color:#4b5563}
label{font-size:13px;color:var(--mu)}
input,select,textarea{width:100%;padding:10px;border:0;border-radius:8px;background:#8881;color:var(--tx);font:inherit;margin:4px 0 12px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:12px;width:100%;font:inherit;font-weight:600}
.btn.del{background:none;color:#dc2626;margin-top:6px}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:420px;margin:0 auto;display:flex;gap:4px;background:var(--card);padding:6px;border-radius:99px;box-shadow:0 4px 16px #0003}
nav button{flex:1;white-space:nowrap;border:0;background:none;padding:6px 4px;border-radius:99px;color:var(--tx);display:flex;flex-direction:column;align-items:center;font-size:12px}
nav .on{background:#dbeafe;color:#1e40af}
summary{cursor:pointer}
h3{margin:22px 0 8px;font-size:16px}
.bar{height:28px;background:#8881;border-radius:6px;margin:4px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pr);border-radius:6px}
ul.mu{padding-left:20px;line-height:1.9;margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar i.ok{background:#16a34a}.bar i.warn{background:#f59e0b}.bar i.bad{background:#dc2626}
.gd{margin-top:6px}.gd p{margin:8px 0}.pt{margin:14px 0 0}.pt b{display:block;margin-bottom:2px}.bl{margin:8px 0 0;padding-left:1em;text-indent:-1em}
</style></head><body>
<div id="app">載入中…</div>
<nav style="display:none"><button data-v="list" onclick="go('list')">🏠<span>看屋筆記</span></button><button data-v="guide" onclick="go('guide')">📖<span>買房攻略</span></button><button data-v="calc" onclick="go('calc')">🧮<span>貸款試算</span></button><button data-v="fin" onclick="go('fin')">📊<span>財務健檢</span></button></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const num=v=>v==null||v===''?'—':(+v).toLocaleString();
const pw=()=>{try{return localStorage.getItem('pw')||''}catch{return''}};
const api=(p,o={})=>fetch('/api/'+p,{headers:{'content-type':'application/json','X-App-Password':pw()},...o}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const ST=['心儀','考慮中','已淘汰'];
let P=[],G=[],view='list',flt='全部',edit=null;

async function load(){[P,G]=await Promise.all([api('properties'),api('guides')]);$('nav').style.display='';go('list')}
function showLogin(msg){
  $('nav').style.display='none';
  $('#app').innerHTML=`<h2>看房筆記</h2><label>請輸入密碼</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><div class="mu" style="color:#dc2626;margin-bottom:8px">${msg||''}</div><button class="btn" onclick="login()">登入</button>`;
}
async function login(){
  const v=$('#pw').value;
  if(!/^[\x20-\x7e]+$/.test(v))return showLogin('密碼請使用英文和數字');
  try{localStorage.setItem('pw',v)}catch{}
  try{await load()}catch(e){try{localStorage.removeItem('pw')}catch{}showLogin(e.message==='401'?'密碼不正確':'載入失敗：'+e.message)}
}
function go(v){view=v;edit=null;draw()}
function draw(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view||(view==='form'&&b.dataset.v==='list')));
  $('#app').innerHTML=({list:vList,form:vForm,guide:vGuide,calc:vCalc,fin:vFin})[view]();
  if(view==='calc')calc();if(view==='fin')fin();
}

function vList(){
  const n=P.length,avg=n?P.reduce((a,p)=>a+(+p.price_wan||0),0)/n:0,top=Math.max(0,...P.map(p=>+p.rating||0)),fav=P.filter(p=>p.status==='心儀').length;
  const L=flt==='全部'?P:P.filter(p=>p.status===flt);
  return `<h2>看屋筆記</h2>
  <div class="grid"><div class="card"><div class="mu">累計看過物件</div><div class="big">${n} 間</div></div>
  <div class="card"><div class="mu">心儀候選</div><div class="big">${fav} 間</div>${fav?'<div class="mu" style="color:#16a34a">可安排複看議價</div>':''}</div>
  <div class="card"><div class="mu">平均開價</div><div class="big">${Math.round(avg).toLocaleString()} 萬</div></div>
  <div class="card"><div class="mu">最高綜合評分</div><div class="big">${top.toFixed(1)} 分</div></div></div>
  <button class="btn" onclick="openForm()">＋ 新增物件</button>
  <div class="tabs">${['全部',...ST].map(s=>`<button class="${s===flt?'on':''}" onclick="flt='${s}';draw()">${s} (${s==='全部'?n:P.filter(p=>p.status===s).length})</button>`).join('')}</div>
  ${L.map(p=>`<div class="card" onclick="openForm(${p.id})">
    <div class="row"><b>${esc(p.title)}</b><span class="b s-${esc(p.status)}">${esc(p.status)}</span></div>
    <div class="mu">📍 ${esc(p.address)}</div>
    <div style="margin:6px 0"><b style="font-size:17px">${num(p.price_wan)} 萬</b> <span class="mu">　${esc(p.layout)}　${num(p.area_ping)} 坪　屋齡 ${num(p.age_years)} 年</span></div>
    <div class="row mu"><span>${esc(p.visit_date)} 看屋</span><span>⭐ ${(+p.rating||0).toFixed(1)}</span></div></div>`).join('')||'<p class="mu">這個分類還沒有物件</p>'}`;
}

const FD=[['title','物件名稱 *','text','例：捷運晴川三房'],['address','地址','text','例：新北市板橋區莊敬路'],['price_wan','開價（萬）','number','2480'],['visit_date','看屋日期','date'],['layout','格局','text','3房2廳2衛'],['area_ping','坪數','number','38.2'],['age_years','屋齡（年）','number','7'],['parking','停車位','text','含坡平車位'],['rating','綜合評分（1–5）','number','4.0'],['status','狀態','select']];
const TX=[['pros','優點'],['cons','缺點'],['notes','備註']],NUMS=['price_wan','area_ping','age_years','rating'];
function openForm(id){edit=id?P.find(p=>p.id===id):{status:'考慮中',rating:3,visit_date:new Date().toISOString().slice(0,10)};view='form';draw();scrollTo(0,0)}
function vForm(){
  const e=edit;
  return `<a class="mu" href="#" onclick="go('list');return false">← 看屋筆記</a><h2>${e.id?'編輯':'新增'}物件記錄</h2>
  ${FD.map(([k,l,t,ph])=>`<label>${l}</label>`+(t==='select'
    ?`<select id="f_${k}">${ST.map(s=>`<option ${s===e[k]?'selected':''}>${s}</option>`).join('')}</select>`
    :`<input id="f_${k}" type="${t}" ${t==='number'?'step="any"':''} value="${esc(e[k])}" placeholder="${esc(ph)}">`)).join('')}
  ${TX.map(([k,l])=>`<label>${l}</label><textarea id="f_${k}" rows="3">${esc(e[k])}</textarea>`).join('')}
  <button class="btn" onclick="save()">儲存</button>${e.id?'<button class="btn del" onclick="del()">刪除這筆</button>':''}`;
}
async function save(){
  const b={};
  [...FD,...TX].forEach(([k])=>{const v=$('#f_'+k).value.trim();b[k]=v===''?null:NUMS.includes(k)?+v:v});
  if(!b.title)return alert('請輸入物件名稱');
  try{await api('properties'+(edit.id?'/'+edit.id:''),{method:edit.id?'PUT':'POST',body:JSON.stringify(b)});P=await api('properties');go('list')}
  catch(e){alert('儲存失敗：'+e.message)}
}
async function del(){
  if(!confirm('確定刪除這筆物件？'))return;
  try{await api('properties/'+edit.id,{method:'DELETE'});P=await api('properties');go('list')}catch(e){alert('刪除失敗：'+e.message)}
}

function fmtG(x){
  const L=String(x??'').replace(/(^|[^\d])(\d+\.\s)/g,'$1\n$2').replace(/(雷區\s?\d+[：:])/g,'\n$1').replace(/•/g,'\n•').split(/\n+/).map(l=>l.trim()).filter(Boolean);
  let h='',open=false;
  for(const l of L){
    if(l[0]==='•'){h+=(open?'</div>':'')+`<div class="bl">${esc(l)}</div>`;open=false}
    else if(/^(\d+\.\s|雷區\s?\d+[：:])/.test(l)){h+=(open?'</div>':'')+`<div class="pt">${l.length<=40?`<b>${esc(l)}</b>`:esc(l)}`;open=true}
    else h+=open?`<div>${esc(l)}</div>`:`<p>${esc(l)}</p>`;
  }
  return h+(open?'</div>':'');
}
const vGuide=()=>'<h2>買房攻略</h2>'+G.map(g=>`<details class="card"><summary><b>${esc(g.title)}</b><div class="mu">${esc(g.category)}</div></summary><div class="gd">${fmtG(g.content)}</div></details>`).join('');

let C={price:2480,dw:496,yr:30,rate:2.1,grace:0};
try{Object.assign(C,JSON.parse(localStorage.getItem('calc')||'{}'))}catch{}
const saveC=()=>{try{localStorage.setItem('calc',JSON.stringify(C))}catch{}};
const upd=(k,v)=>{C[k]=+v;saveC();calc()};
const opt=(arr,cur,fmt)=>arr.map(a=>`<option value="${a}" ${a==cur?'selected':''}>${fmt(a)}</option>`).join('');
const vCalc=()=>`<h2>貸款試算</h2>
<label>帶入看過的物件</label><select onchange="pick(this.value)"><option value="">手動輸入</option>${P.map(p=>`<option value="${+p.price_wan||''}">${esc(p.title)}（${num(p.price_wan)} 萬）</option>`).join('')}</select>
<label>房屋總價（萬）</label><input id="c_price" type="number" value="${C.price}" oninput="upd('price',this.value)">
<label>頭期款金額（萬）</label><input id="c_dw" type="number" value="${C.dw}" oninput="upd('dw',this.value)">
<label>貸款年期</label><select onchange="upd('yr',this.value)">${opt([10,15,20,25,30,35,40],C.yr,a=>a+' 年')}</select>
<label>寬限期</label><select onchange="upd('grace',this.value)">${opt([0,1,2,3,4,5],C.grace,a=>a?a+' 年':'無寬限期')}</select>
<label>年利率（%）</label><input type="number" step="0.01" value="${C.rate}" oninput="upd('rate',this.value)">
<div id="c_out"></div>`;
function pick(x){if(x){const k=C.price?C.dw/C.price:.2;C.price=+x;C.dw=Math.round(C.price*k);saveC();$('#c_price').value=C.price;$('#c_dw').value=C.dw;calc()}}
function calc(){
  const price=C.price*1e4,down=C.dw*1e4,pct=price?Math.round(down/price*100):0,L=price-down,n=C.yr*12,g=C.grace*12,m=n-g,r=C.rate/1200,
    W=x=>Math.round(x/1e4).toLocaleString()+' 萬',Y=x=>Math.round(x).toLocaleString()+' 元';
  if(L<=0||m<=0)return $('#c_out').innerHTML='<p class="mu">請輸入完整資料</p>';
  const pay=r?L*r/(1-Math.pow(1+r,-m)):L/m,gp=L*r,tot=g*gp+pay*m-L,mx=Math.max(L,tot);
  const box=(l,v,s)=>`<div class="card"><div class="mu">${l}</div><div class="big">${v}</div><div class="mu">${s}</div></div>`;
  $('#c_out').innerHTML=`<div class="grid" style="margin-top:8px">
    ${box(g?'寬限期後每月還款':'每月還款',Y(pay),g?`寬限期後共 ${m} 期`:`共 ${C.yr} 年 · ${n} 期`)}
    ${box('頭期款',W(down),`占房價 ${pct}%`)}
    ${box('貸款金額',W(L),`${100-pct}% 貸款成數`)}
    ${box('利息總支出',W(tot),'貸款期間累計')}</div>
  ${g?box('寬限期內每月繳款（只繳利息）',Y(gp),`寬限期 ${C.grace} 年，期間不還本金`):''}
  <h3>本金 vs 利息比例</h3>
  ${[['貸款本金',L],['利息總支出',tot]].map(([l,v])=>`<div class="row mu"><span>${l}</span><b style="color:var(--tx)">${W(v)}</b></div><div class="bar"><i style="width:${Math.max(v/mx*100,1)}%"></i></div>`).join('')}
  <h3>試算說明</h3>
  <ul class="mu"><li>採本息平均攤還方式試算</li><li>寬限期內只繳利息、不還本金，寬限期後在剩餘年期內攤還，每月還款會變高；貸款年期已包含寬限期</li><li>實際利率依銀行核定為準，通常前 2 年較低後調升</li><li>建議留意「房貸負擔率」不超過月收入的 30–35%</li><li>以上試算不含保險費、開辦費等其他費用</li></ul>`;
}
const mort=()=>{const L=C.price*1e4-C.dw*1e4,n=C.yr*12,g=C.grace*12,m=n-g,r=C.rate/1200;if(L<=0||m<=0)return{pay:0,gp:0,g};return{pay:r?L*r/(1-Math.pow(1+r,-m)):L/m,gp:L*r,g}};
let F={salary:0,side:0,div:0,bonus:0,live:0,parent:0,util:0,ins:0,lic:0,fuel:0,tax:0};
try{Object.assign(F,JSON.parse(localStorage.getItem('fin')||'{}'))}catch{}
const updF=(k,v)=>{F[k]=+v;try{localStorage.setItem('fin',JSON.stringify(F))}catch{}fin()};
const FG=[['月收入（元／月）',[['salary','薪資'],['side','副業']]],['年收入（元／年）',[['div','股利'],['bonus','主業獎金']]],['月支出（元／月）',[['live','生活開銷'],['parent','孝親費'],['util','水電費']]],['年支出（元／年）',[['ins','保險（年）'],['lic','牌照稅（年）'],['fuel','燃料稅（年）'],['tax','所得稅（年）']]]];
const vFin=()=>'<h2>財務健檢</h2>'+FG.map(([t,fs])=>`<h3>${t}</h3><div class="g2">${fs.map(([k,l])=>`<div><label>${l}</label><input type="number" value="${F[k]||''}" placeholder="0" oninput="updF('${k}',this.value)"></div>`).join('')}</div>`).join('')+'<div id="f_out"></div>';
function fin(){
  const Y=x=>Math.round(x).toLocaleString()+' 元',inc=F.salary+F.side+(F.div+F.bonus)/12,exp=F.live+F.parent+F.util+(F.ins+F.lic+F.fuel+F.tax)/12,bal=inc-exp,M=mort();
  const box=(l,v,s)=>`<div class="card"><div class="mu">${l}</div><div class="big">${v}</div><div class="mu">${s}</div></div>`;
  const bar=(l,pay)=>{const p=inc>0?pay/inc*100:0;return `<div class="row mu"><span>${l}</span><b style="color:var(--tx)">${inc>0?p.toFixed(1)+'%':'—'}</b></div><div class="bar"><i class="${p<=30?'ok':p<=35?'warn':'bad'}" style="width:${Math.min(p,100)}%"></i></div>`};
  $('#f_out').innerHTML=`<div class="grid" style="margin-top:8px">
    ${box('平均月收入',Y(inc),'月收入＋年收入 ÷ 12')}
    ${box('平均月支出',Y(exp),'月支出＋年支出 ÷ 12')}
    ${box('每月所得餘額',Y(bal),'平均收入 − 平均支出')}
    ${box('扣除房貸後餘額',Y(bal-M.pay),'已扣除每月房貸')}</div>
  <h3>房貸負債比</h3>
  ${M.g?bar('寬限期後 · 每月 '+Y(M.pay),M.pay)+bar('寬限期內 · 每月 '+Y(M.gp),M.gp):bar('每月房貸 '+Y(M.pay),M.pay)}
  <h3>試算說明</h3>
  <ul class="mu"><li>平均月收入＝月收入＋年收入 ÷ 12，平均月支出同理，把年支出攤成每月</li><li>房貸負債比＝每月房貸 ÷ 平均月收入，房貸金額取自「貸款試算」目前的設定</li><li>顏色參考：綠色 30% 以下、橘色 30–35%、紅色超過 35%（常見參考值，不是銀行核貸標準）</li><li>未填寫的項目（醫療、旅遊等）不在計算內，建議另外預留緊急預備金</li></ul>`;
}
load().catch(e=>e.message==='401'?showLogin():$('#app').innerHTML='<p class="mu">載入失敗：'+esc(e.message)+'（請確認 D1 已綁定為 DB 並已匯入資料）</p>');
</script></body></html>
